x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-security: &security
  security_opt:
    - no-new-privileges:true

# Environment shared by every n8n process (main, worker, webhook).
# N8N_ENCRYPTION_KEY MUST be identical everywhere, otherwise workers cannot
# decrypt the credentials stored in the database.
x-n8n-env: &n8n-env
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: postgres
  DB_POSTGRESDB_PORT: "5432"
  DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n}
  DB_POSTGRESDB_USER: ${POSTGRES_USER:-n8n}
  DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init.sh to generate .env}
  EXECUTIONS_MODE: queue
  QUEUE_BULL_REDIS_HOST: redis
  QUEUE_BULL_REDIS_PORT: "6379"
  QUEUE_BULL_REDIS_PASSWORD: ${REDIS_PASSWORD:?Run scripts/init.sh to generate .env}
  QUEUE_HEALTH_CHECK_ACTIVE: "true"
  N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Run scripts/init.sh to generate .env}
  N8N_HOST: ${N8N_HOST:?Set N8N_HOST in .env}
  N8N_PORT: "5678"
  N8N_PROTOCOL: https
  N8N_EDITOR_BASE_URL: https://${N8N_HOST}/
  N8N_WEBHOOK_URL: https://${N8N_HOST}/
  N8N_PROXY_HOPS: "1"
  N8N_RUNNERS_ENABLED: "true"
  N8N_DEFAULT_BINARY_DATA_MODE: database
  N8N_DIAGNOSTICS_ENABLED: ${N8N_DIAGNOSTICS_ENABLED:-false}
  N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
  N8N_GRACEFUL_SHUTDOWN_TIMEOUT: "30"
  EXECUTIONS_DATA_PRUNE: "true"
  EXECUTIONS_DATA_MAX_AGE: ${EXECUTIONS_DATA_MAX_AGE:-336}
  GENERIC_TIMEZONE: ${TZ:-UTC}
  TZ: ${TZ:-UTC}
  N8N_LOG_LEVEL: ${N8N_LOG_LEVEL:-info}

x-n8n: &n8n-base
  image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-2.46.6}
  restart: unless-stopped
  logging: *logging
  <<: *security

services:
  postgres:
    image: postgres:16.15-alpine
    restart: unless-stopped
    logging: *logging
    <<: *security
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
      POSTGRES_USER: ${POSTGRES_USER:-n8n}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init.sh to generate .env}
      TZ: ${TZ:-UTC}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: ${POSTGRES_CPUS:-1.0}
          memory: ${POSTGRES_MEMORY:-1g}

  redis:
    image: redis:7.4.12-alpine
    restart: unless-stopped
    logging: *logging
    <<: *security
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run scripts/init.sh to generate .env}
    # noeviction is required: Bull queue keys must never be evicted.
    command:
      - sh
      - -c
      - >-
        exec redis-server
        --requirepass "$$REDIS_PASSWORD"
        --appendonly yes
        --maxmemory ${REDIS_MAXMEMORY:-256mb}
        --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: ${REDIS_CPUS:-0.5}
          memory: ${REDIS_MEMORY:-384m}

  n8n-main:
    <<: *n8n-base
    environment:
      <<: *n8n-env
      # Send manual (editor) test runs to workers so the main process stays responsive.
      OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: "true"
      # Set to true when the optional n8n-webhook profile is enabled.
      N8N_DISABLE_PRODUCTION_MAIN_PROCESS: ${N8N_DISABLE_PRODUCTION_MAIN_PROCESS:-false}
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - edge
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5678/healthz/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: ${N8N_MAIN_CPUS:-1.0}
          memory: ${N8N_MAIN_MEMORY:-1g}

  # Scale with: docker compose up -d --scale n8n-worker=3   (or: make scale WORKERS=3)
  n8n-worker:
    <<: *n8n-base
    command: worker --concurrency=${N8N_WORKER_CONCURRENCY:-10}
    environment:
      <<: *n8n-env
    networks:
      - edge     # outbound internet access for workflow nodes
      - backend
    depends_on:
      n8n-main:
        condition: service_healthy
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5678/healthz/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    deploy:
      replicas: ${N8N_WORKER_REPLICAS:-1}
      resources:
        limits:
          cpus: ${N8N_WORKER_CPUS:-1.0}
          memory: ${N8N_WORKER_MEMORY:-1g}

  # Optional dedicated webhook processor. Enable with COMPOSE_PROFILES=webhook,
  # WEBHOOK_UPSTREAM=n8n-webhook:5678 and N8N_DISABLE_PRODUCTION_MAIN_PROCESS=true.
  n8n-webhook:
    <<: *n8n-base
    command: webhook
    profiles: ["webhook"]
    environment:
      <<: *n8n-env
    networks:
      - edge
      - backend
    depends_on:
      n8n-main:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5678/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    deploy:
      replicas: ${N8N_WEBHOOK_REPLICAS:-1}
      resources:
        limits:
          cpus: ${N8N_WEBHOOK_CPUS:-0.5}
          memory: ${N8N_WEBHOOK_MEMORY:-512m}

  caddy:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    logging: *logging
    <<: *security
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    environment:
      N8N_HOST: ${N8N_HOST:?Set N8N_HOST in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
      WEBHOOK_UPSTREAM: ${WEBHOOK_UPSTREAM:-n8n-main:5678}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
    depends_on:
      n8n-main:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:2019/config/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: ${CADDY_CPUS:-0.5}
          memory: ${CADDY_MEMORY:-256m}

  backup:
    build:
      context: ./backup
    image: n8n-production-stack/backup:1.0.0
    restart: unless-stopped
    logging: *logging
    <<: *security
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-n8n}
      PGUSER: ${POSTGRES_USER:-n8n}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init.sh to generate .env}
      TZ: ${TZ:-UTC}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 3 * * *}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_ON_START: ${BACKUP_ON_START:-false}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-n8n}
      BACKUP_S3_RETENTION_DAYS: ${BACKUP_S3_RETENTION_DAYS:-30}
      S3_PROVIDER: ${S3_PROVIDER:-AWS}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    volumes:
      - backups:/backups
    networks:
      - backend
      - edge     # outbound access for the optional S3 upload
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q && pgrep crond >/dev/null"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: ${BACKUP_CPUS:-0.5}
          memory: ${BACKUP_MEMORY:-256m}

networks:
  # Public-facing network; also provides outbound internet access.
  edge:
    driver: bridge
  # Private network for PostgreSQL and Redis: no external connectivity at all.
  backend:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  redis_data:
  n8n_data:
  caddy_data:
  caddy_config:
  backups:
