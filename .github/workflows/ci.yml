name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate test .env
        run: ./scripts/init.sh --domain n8n.ci.example.com --email ci@example.com

      - name: init.sh refuses to overwrite
        run: |
          if ./scripts/init.sh --domain a.example.com --email a@example.com; then
            echo "init.sh overwrote an existing .env" >&2
            exit 1
          fi

      - name: Preflight check of the generated .env
        # the CI domain is a placeholder, so this reports a warning but must not fail
        run: ./scripts/preflight.sh

      - name: Preflight rejects the untouched template
        run: |
          if ./scripts/preflight.sh --env-file .env.example --quiet; then
            echo "preflight accepted CHANGE_ME placeholders" >&2
            exit 1
          fi

      - name: docker compose config
        run: docker compose config --quiet

      - name: docker compose config (webhook profile)
        run: docker compose --profile webhook config --quiet

      - name: Validate Caddyfile
        run: |
          # read only the values Caddy needs (some .env values contain spaces, e.g. cron schedules)
          N8N_HOST="$(grep -E '^N8N_HOST=' .env | cut -d= -f2-)"
          ACME_EMAIL="$(grep -E '^ACME_EMAIL=' .env | cut -d= -f2-)"
          docker run --rm -e N8N_HOST="$N8N_HOST" -e ACME_EMAIL="$ACME_EMAIL" -e WEBHOOK_UPSTREAM=n8n-main:5678 \
            -v "$PWD/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.9-alpine caddy validate --config /etc/caddy/Caddyfile

      - name: Build backup image
        run: docker compose build backup

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n
        run: |
          for f in scripts/*.sh backup/*.sh; do bash -n "$f"; done

      - name: shellcheck
        run: shellcheck -x scripts/*.sh backup/*.sh tests/*.bats tests/*.bash

      - name: yamllint
        run: |
          pip install --quiet yamllint
          yamllint -c .yamllint compose.yaml .github/workflows

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install bats
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bats

      - name: bats
        run: bats tests/
