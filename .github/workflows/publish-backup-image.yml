name: Publish backup image

on:
  push:
    branches: [main]
    paths: ['backup/**', '.github/workflows/publish-backup-image.yml']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/saizul/n8n-stack-backup
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.title=n8n-stack-backup
            org.opencontainers.image.description=Scheduled Postgres backups with retention and S3 upload for n8n-production-stack
            org.opencontainers.image.licenses=MIT
      - uses: docker/build-push-action@v6
        with:
          context: backup
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
